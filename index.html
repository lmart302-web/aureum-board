
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아우름 보드 | AUREUM BOARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <header class="header">
            <div class="logo-area">
                <h1>AUREUM BOARD</h1>
                <p>조직도 · 구성원 · 휴가 일정</p>
            </div>
        </header>

        <nav class="main-nav">
            <button class="nav-button active" data-page="organization">조직도</button>
            <button class="nav-button" data-page="calendar">휴가 달력</button>
            <button class="nav-button" data-page="members">구성원 관리</button>
        </nav>

        <main id="main-content">
            <section class="welcome-section">
                <h2>우리의 조직을 한눈에</h2>
                <p>아우름 보드에 오신 것을 환영합니다.</p>
            </section>

            <section id="organization-page" class="page active">
                <div class="section-header">
                    <div>
                        <h2>조직도</h2>
                        <p>반별 팀 구성과 휴가 현황을 확인하세요.</p>
                    </div>
                </div>

                <div id="organization-container"></div>
                <div id="team-detail-container"></div>
            </section>

            
<section id="calendar-page" class="page">

    <div class="section-header">
        <div>
            <h2>휴가 달력</h2>
            <p>팀별 휴가 일정을 한눈에 확인하세요.</p>
        </div>
    </div>

    <div class="calendar-card">

        <div class="calendar-header">
            <button id="prev-month">이전</button>
            <h3 id="calendar-title"></h3>
            <button id="next-month">다음</button>
        </div>

        <div class="calendar-weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div id="calendar-days" class="calendar-days"></div>

<div id="vacation-detail-container"></div>

    </div>

</section>


            <section id="members-page" class="page">
                <h2>구성원 관리</h2>
                <p>팀별 구성원을 등록하고 관리할 수 있습니다.</p>
            </section>
        </main>

        <footer>
            <p>AUREUM BOARD</p>
        </footer>

    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
